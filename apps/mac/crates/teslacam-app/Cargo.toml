[package]
name = "teslacam-app"
description = "TeslaCam Viewer for macOS (GPUI Kit)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "teslacam-viewer"
path = "src/main.rs"

[dependencies]
teslacam-core.workspace = true
teslacam-media.workspace = true
gpui-kit.workspace = true
futures.workspace = true
raw-window-handle.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSString"] }
objc2-core-video = { workspace = true, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSAppearance", "NSResponder", "NSView", "NSWindow"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
