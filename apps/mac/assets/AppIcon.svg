<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TeslaCam Viewer app icon: the garage floor (DESIGN.md §2 floor / ink / drive), a car seen from
       above and its six camera windows; the front camera is active. Rendered by scripts/bundle.sh. -->
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5F7"/>
      <stop offset="1" stop-color="#E2E5E9"/>
    </linearGradient>
    <linearGradient id="wedge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3E6AE1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3E6AE1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2E36"/>
      <stop offset="0.5" stop-color="#3A3F48"/>
      <stop offset="1" stop-color="#2A2E36"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#floor)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#171A20" stroke-opacity="0.08"/>
  <!-- active front wedge -->
  <polygon points="512,452 418,300 606,300" fill="url(#wedge)"/>
  <!-- camera windows -->
  <g fill="#171A20">
    <rect x="410" y="196" width="204" height="122" rx="22"/>
    <rect x="170" y="330" width="170" height="128" rx="22" fill-opacity="0.82"/>
    <rect x="684" y="330" width="170" height="128" rx="22" fill-opacity="0.82"/>
    <rect x="170" y="586" width="170" height="128" rx="22" fill-opacity="0.82"/>
    <rect x="684" y="586" width="170" height="128" rx="22" fill-opacity="0.82"/>
    <rect x="420" y="740" width="184" height="104" rx="22" fill-opacity="0.82"/>
  </g>
  <rect x="404" y="190" width="216" height="134" rx="27" fill="none" stroke="#3E6AE1" stroke-width="8"/>
  <!-- car from above -->
  <rect x="452" y="392" width="120" height="314" rx="58" fill="url(#body)"/>
  <rect x="470" y="470" width="84" height="64" rx="18" fill="#5B6270"/>
  <rect x="474" y="610" width="76" height="52" rx="16" fill="#5B6270"/>
  <rect x="462" y="690" width="32" height="10" rx="5" fill="#E04848"/>
  <rect x="530" y="690" width="32" height="10" rx="5" fill="#E04848"/>
  <circle cx="512" cy="452" r="15" fill="#3E6AE1" stroke="#FFFFFF" stroke-width="7"/>
</svg>
