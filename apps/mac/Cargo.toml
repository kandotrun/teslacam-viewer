[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
teslacam-core = { path = "crates/teslacam-core" }
teslacam-media = { path = "crates/teslacam-media" }

# GPUI Kit 0.8.0 pins gpui-pre =0.3.9 and enables runtime shaders (no Metal Toolchain needed).
gpui-kit = "=0.8.0"
gpui-testing-library = "0.1.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-core-image = "0.3.2"
objc2-core-text = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
